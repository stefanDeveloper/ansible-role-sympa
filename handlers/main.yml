---
- name: restart sympa
  ansible.builtin.service:
    name: sympa
    state: restarted

- name: restart sympa-archive
  ansible.builtin.service:
    name: sympa-archive
    state: restarted

- name: restart sympa-bounce
  ansible.builtin.service:
    name: sympa-bounce
    state: restarted

- name: restart sympa-outgoing
  ansible.builtin.service:
    name: sympa-outgoing
    state: restarted

- name: restart sympa-task
  ansible.builtin.service:
    name: sympa-task
    state: restarted

- name: restart wwsympa
  ansible.builtin.service:
    name: wwsympa
    state: restarted
  when: sympa_web_fcgi_enabled

- name: restart sympasoap
  ansible.builtin.service:
    name: sympasoap
    state: restarted
  when: sympa_soap_fcgi_enabled

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
